paths:
  raw_data: data/raw             # gitignored — cleared after streaming
  tiles: data/tiles              # gitignored — cleared after inference
  masks: data/masks              # gitignored — kept until demo precomputed
  vegetation: data/vegetation    # gitignored
  checkpoints: model/checkpoints # gitignored
  precomputed: demo/precomputed  # tracked — only PNGs and JSON

tiling:
  tile_size: 512
  overlap: 0.20
  min_valid_pixels: 0.70

model:
  backbone: nvidia/mit-b2
  num_classes: 6                 # 0–5 (cropland added, roads removed)
  batch_size: 8
  learning_rate: 0.00006
  weight_decay: 0.01
  epochs: 50
  early_stopping_patience: 7
  mixed_precision: true
  label_smoothing: 0.1

classes:
  0: background
  1: buildings
  2: cropland                    # Shifted from 3
  3: dense_vegetation            # Shifted from 4
  4: water                       # Shifted from 5
  5: bare_soil                   # Shifted from 6

class_colors:                    # RGB for visualisation
  0: [0, 0, 0]                   # background — black
  1: [220, 38, 38]               # buildings — red
  2: [212, 160, 23]              # cropland — gold
  3: [34, 139, 34]               # dense vegetation — green
  4: [30, 100, 200]              # water — blue
  5: [210, 180, 140]             # bare soil — tan

analytics:
  ndvi_vegetation_threshold: 0.3
  abi_warning_threshold: 0.5
  abi_critical_threshold: 0.3
  encroachment_drop_pct: 0.20
  window_years: 5
  resolution_m: 10               # Sentinel-2 resolution in metres

sentinel:
  bands: [B04, B03, B02, B08]   # Red, Green, Blue, NIR
  resolution: 10                  # metres per pixel
  cloud_cover_max: 15            # slightly relaxed for agricultural zones

# Farmland-adjacent zones — chosen because active cropland borders
# rapidly expanding Indian cities (verified from Sentinel-2 visual inspection)
zones:
