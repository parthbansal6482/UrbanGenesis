stac:
  endpoint: "https://planetarycomputer.microsoft.com/api/stac/v1"
  collection: "sentinel-2-l2a"
  # No credentials needed — Planetary Computer is free and anonymous
  # Token is auto-signed via planetary_computer.sign_inplace()

